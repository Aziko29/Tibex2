<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>TIBEX — Bemor kabineti</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="static/css/bemor-profile.da20e97c.css">
</head>
<body>

<!-- ═══════════════════ TOPBAR ═══════════════════ -->
<header class="bp-top">
  <div class="bp-brand">
    <span class="bp-brand-mark">T</span>
    <span class="bp-brand-text">Bemor kabineti</span>
  </div>

  <div class="bp-top-actions">
    <button class="bp-icon-btn" id="btnSettings" title="Sozlamalar" aria-label="Sozlamalar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <button class="bp-user" id="btnUserMenu" aria-label="Foydalanuvchi menyusi">
      <span class="bp-avatar" id="userAvatar">?</span>
      <span class="bp-user-name" id="userName">…</span>
    </button>
  </div>
</header>

<!-- ═══════════════════ DESKTOP TABS ═══════════════════ -->
<nav class="bp-tabs" id="bpTabs" role="tablist" aria-label="Bo'limlar"></nav>

<!-- ═══════════════════ MAIN CONTENT ═══════════════════ -->
<main class="bp-main" id="bpMain" role="tabpanel"></main>

<!-- ═══════════════════ MOBILE BOTTOM NAV ═══════════════════ -->
<nav class="bp-bottomnav" id="bpBottomNav" aria-label="Asosiy bo'limlar"></nav>

<!-- ═══════════════════ SETTINGS DRAWER ═══════════════════ -->
<div class="bp-backdrop" id="bpBackdrop"></div>
<aside class="bp-drawer" id="bpDrawer" aria-hidden="true" role="dialog" aria-label="Sozlamalar">
  <div class="bp-drawer-head">
    <div>
      <h3>Sozlamalar</h3>
      <p class="bp-drawer-sub">Shaxsiy imtiyozlar va xavfsizlik</p>
    </div>
    <button class="bp-icon-btn ghost" id="btnDrawerClose" aria-label="Yopish">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>
  <div class="bp-drawer-body" id="bpDrawerBody"></div>
  <div class="bp-drawer-foot">
    <span id="drawerVersion">TIBEX v1.0</span>
    <button class="bp-btn danger sm" id="btnDrawerLogout">Chiqish</button>
  </div>
</aside>

<!-- ═══════════════════ MODAL: PROFILE EDIT ═══════════════════ -->
<div class="bp-modal-bg" id="profileEditModal" hidden>
  <div class="bp-modal">
    <div class="bp-modal-head">
      <h3>Profilni tahrirlash</h3>
      <button class="bp-icon-btn ghost" data-close-modal aria-label="Yopish">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="bp-modal-body">
      <label class="bp-field">
        <span class="bp-label">Telefon raqam</span>
        <input type="tel" id="editPhone" placeholder="+998 90 123 45 67" inputmode="tel" autocomplete="tel">
        <small class="bp-hint">Raqam o'zgarsa, kirish ham shu raqamga bog'lanadi</small>
      </label>
      <label class="bp-field">
        <span class="bp-label">Manzil</span>
        <input type="text" id="editAddress" placeholder="Toshkent sh., ..." autocomplete="street-address">
      </label>
    </div>
    <div class="bp-modal-foot">
      <button class="bp-btn ghost" data-close-modal>Bekor qilish</button>
      <button class="bp-btn primary" id="btnSaveProfile">Saqlash</button>
    </div>
  </div>
</div>

<!-- ═══════════════════ TOAST ═══════════════════ -->
<div class="bp-toast" id="bpToast" role="status" aria-live="polite"></div>

<!-- ═══════════════════ SCRIPTS ═══════════════════ -->
<script src="static/tibex-safe.js"></script>
<script src="static/tibex-safe-bind.js"></script>
<script src="static/js/bemor.e308bce8.js"></script>
</body>
</html>
