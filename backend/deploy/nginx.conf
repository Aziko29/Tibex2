# TIBEX nginx reverse proxy. This file is included from nginx's http context.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# TIBEX_TUNNEL_REALIP_v1: Cloudflare Tunnel orqali kelgan trafikda haqiqiy klient IP.
# cloudflared nginx'ga 127.0.0.1 (yoki docker gateway) dan ulanadi, shuning uchun
# $remote_addr = cloudflared manzili bo'lib qoladi va backend TASHQI klientni
# LOKAL deb qabul qilardi. Endi Cf-Connecting-Ip FAQAT quyida sanalgan manzildan
# (cloudflared) kelgan ulanishda haqiqiy klient IP sifatida olinadi. LAN yoki
# internetdan to'g'ridan-to'g'ri kelgan so'rovdagi soxta Cf-Connecting-Ip
# e'tiborsiz qoldiriladi.
# DIQQAT: bu ro'yxatga LAN diapazonlarini (10/8, 172.16/12, 192.168/16) QO'SHMANG.
# Faqat cloudflared'ning aniq manzilini yozing.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
# cloudflared docker konteynerida bo'lsa, nginx ko'radigan aniq manzilni qo'shing:
# set_real_ip_from 172.18.0.2;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# So'rovda Cf-Connecting-Ip bo'lsa (ya'ni tunnel/Cloudflare orqali kelgan bo'lsa) 1.
# Backend bu belgini fail-closed himoya uchun ishlatadi: tunnel so'rovining klienti
# hech qachon LOKAL IP bo'la olmaydi. Header asl so'rovdan o'qiladi (realip uni o'zgartirmaydi).
map $http_cf_connecting_ip $tibex_via_tunnel {
    default 1;
    ""      0;
}

upstream tibex_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    server_name tibex.uz www.tibex.uz;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tibex.uz www.tibex.uz;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/tibex.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tibex.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), usb=(self)" always;
    # CSP ENFORCE (23-band: inline handlerlar olib tashlandi).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' wss://tibex.uz; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri /api/security/csp-report" always;

    client_max_body_size 10M;

    location ~* "^/static/(.*\.[0-9a-f]{8}\.(?:js|css))$" {
        alias /var/www/tibex/frontend/public/static/$1;
        expires 7d;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), usb=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' wss://tibex.uz; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri /api/security/csp-report" always;
    }

    location /static/ {
        alias /var/www/tibex/frontend/public/static/;
        expires -1;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), usb=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' wss://tibex.uz; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri /api/security/csp-report" always;
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://tibex_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cf-Connecting-Ip "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Tibex-Tunnel $tibex_via_tunnel;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/otp/request {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://tibex_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cf-Connecting-Ip "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Tibex-Tunnel $tibex_via_tunnel;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/otp/verify {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://tibex_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cf-Connecting-Ip "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Tibex-Tunnel $tibex_via_tunnel;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ws {
        proxy_pass http://tibex_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cf-Connecting-Ip "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Tibex-Tunnel $tibex_via_tunnel;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://tibex_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cf-Connecting-Ip "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Tibex-Tunnel $tibex_via_tunnel;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~* \.(deb|md|py|env|bak|sql|zip|log)$ { return 404; }
    location ~ /\. { return 404; }

    # Ochiq sayt: faqat public/ (frontend/tools/build_public.py yig'adi). Xodim sahifalari bu yerda YO'Q.
    location = / {
        root /var/www/tibex/frontend/public;
        try_files /index.html =404;
    }

    location / {
        root /var/www/tibex/frontend/public;
        autoindex off;
        try_files $uri =404;
    }
}
