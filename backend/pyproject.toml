[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tibex-backend"
version = "0.1.0"
description = "TIBEX — klinika boshqaruv tizimi backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "TIBEX Dev", email = "dev@tibex.uz" }]

dependencies = [
    "fastapi~=0.141.1",
    "uvicorn[standard]~=0.54.0",
    "gunicorn~=26.2.0",
    "sqlalchemy[asyncio]~=2.1.1",
    "asyncpg~=0.31.0",
    "alembic~=1.20.0",
    "pydantic~=2.13.5",
    "pydantic-settings~=2.15.0",
    "redis~=8.1.0",
    "argon2-cffi~=25.1.0",
    "cryptography~=46.0.6",
    "python-multipart~=0.0.32",
    "websockets~=17.1",
    "orjson~=3.12.0",
    "httpx~=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "faker>=30.0.0",
]

[project.scripts]
tibex-init-db = "scripts.init_db:main"
tibex-init-admin = "scripts.create_admin:main"
tibex-backup = "scripts.backup_db:main"
tibex-simulate = "scripts.clinic_simulation:main"

# ⚠️ ENG MUHIM QISM — paketlarni aniq ko'rsatish
[tool.setuptools]
packages = ["app", "app.security", "app.routers", "scripts"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "alembic/versions", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "N818"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
